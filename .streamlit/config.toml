# Streamlit tema ayarları: README ekran görüntülerindeki koyu tema ve kırmızı buton.

[theme]
base = "dark"
primaryColor = "#FF0000"              # kırmızı "Sınıflandır" butonu
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#262730"
textColor = "#FAFAFA"

[client]
toolbarMode = "minimal"   # sağ üstteki geliştirici menüsünü sadeleştirir

[browser]
gatherUsageStats = false
